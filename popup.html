<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <title>Layout Grid Visualizer</title>

  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header class="app-header">
    <img class="brand-mark" src="icons/icon128.png" alt="" width="32" height="32">
    <div class="brand-copy">
      <h1>Layout Grid</h1>
      <p>Visualizer</p>
    </div>
  </header>

  <main class="form-grid">
    <div class="form-group">
      <label for="gridWidth">Grid Width (px)</label>
      <input type="number" id="gridWidth" value="1320" min="1">
    </div>

    <div class="form-group">
      <label for="gutterSize">Gutter (px)</label>
      <input type="number" id="gutterSize" value="32" min="1">
    </div>

    <div class="form-group span-2">
      <label for="columns">Columns</label>

      <div class="w-form-grid-columns">
        <div class="form-grid-columns">
          <input type="number" id="columns" value="12" min="1">
        </div>

        <div class="form-grid-buttons">
          <button id="addColumn" aria-label="Add Column" title="Add Column Grid">&#43;</button>
          <button id="removeColumn" aria-label="Remove Column" title="Remove Column Grid">&ndash;</button>
        </div>
      </div>
    </div>

    <div class="form-group span-2 inline-group">
      <label for="gridColor">Grid Color</label>
      <div class="color-input">
        <input type="color" id="gridColor" value="#1a73e8">
      </div>
    </div>

    <div class="form-group span-2">
      <label for="opacity">Grid Opacity (%)</label>
      <div class="opacity-input">
        <input type="range" id="opacityRange" min="0" max="100" step="1" value="30" aria-label="Grid opacity percentage">
        <input type="number" id="opacity" value="30" min="0" max="100" step="1">
      </div>
    </div>

    <div class="form-group span-2 action-group">
      <button id="toggleGrid" title="Show the grid overlay">Show Grid</button>

      <div class="button-row">
        <button id="centerGrid" class="secondary" aria-label="Center grid" title="Center the grid overlay">Center</button>
        <button id="splitGrid" class="secondary" aria-label="Split grid" title="Split the grid overlay">Split</button>
        <button id="resetGrid" class="secondary" aria-label="Reset to defaults" title="Reset all fields to default values">Reset</button>
      </div>
    </div>

    <div class="form-group span-2">
      <label class="switch-row">
        <span>Grid clickable</span>

        <span class="toggle">
          <input type="checkbox" id="gridClickable" checked>
          <span class="slider"></span>
        </span>
      </label>
    </div>
  </main>

  <script src="popup.js"></script>
</body>

</html>
